name: Baseline Check

on:
  push:
  workflow_dispatch:

jobs:
  baseline-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check reconstruction documents
        run: |
          test -f README.md
          test -f reconstruction/APK_ANALYSIS.md
          test -f reconstruction/CLASS_INDEX.txt
          grep -q 'com.gievetrecord' README.md
          grep -q 'GoogleDriveAutoSyncWorker' reconstruction/APK_ANALYSIS.md
          grep -q 'KomponenPaginationKt' reconstruction/APK_ANALYSIS.md
          echo 'Baseline documentation OK.'
